name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `git describe --tags` embeds the exact tag version.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build all architectures
        run: make build-all
      - name: Generate checksums
        run: cd bin && sha256sum sysext-linux-* > checksums.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: bin/sysext-linux-*
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            bin/sysext-linux-*
            bin/checksums.txt
