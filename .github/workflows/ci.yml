name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        goarch: [amd64, arm64, riscv64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile (linux/${{ matrix.goarch }})
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -extldflags \"-static\"" \
            -o bin/sysext-linux-${{ matrix.goarch }} ./cmd/sysext
      - uses: actions/upload-artifact@v4
        with:
          name: sysext-linux-${{ matrix.goarch }}
          path: bin/sysext-linux-${{ matrix.goarch }}
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static binary
        run: make build-static
      # Privileged Alpine container with /lib/modules mounted; suites that
      # need a kernel module unavailable on the runner (e.g. erofs) SKIP.
      - name: Run e2e suites
        run: ./test/e2e/run.sh
