name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test (with coverage)
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          {
            echo '## Unit coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.out
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        goarch: [amd64, arm64, riscv64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile (linux/${{ matrix.goarch }})
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -extldflags \"-static\"" \
            -o bin/sysext-linux-${{ matrix.goarch }} ./cmd/sysext
      - uses: actions/upload-artifact@v4
        with:
          name: sysext-linux-${{ matrix.goarch }}
          path: bin/sysext-linux-${{ matrix.goarch }}
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Build the signed example DDI so the interop part of inner-signed.sh
      # runs (it SKIPs gracefully when systemd-repart is unavailable).
      - name: Build signed example
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q erofs-utils systemd-repart || \
            sudo apt-get install -y -q erofs-utils || true
          if command -v systemd-repart >/dev/null; then
            make example
          else
            echo "systemd-repart unavailable; interop fixture test will SKIP"
          fi
      # Privileged Alpine container with /lib/modules mounted; suites that
      # need a kernel module unavailable on the runner (e.g. erofs) SKIP.
      # Runs with a coverage-instrumented binary (make e2e-cover) so the
      # mount/loop/dm paths unit tests cannot reach are measured too.
      - name: Run e2e suites (instrumented)
        run: make e2e-cover
      - name: e2e coverage summary
        run: |
          {
            echo '## e2e coverage'
            echo '```'
            go tool cover -func=coverage-e2e.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e
          path: coverage-e2e.out
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage-e2e.out
          flags: e2e
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
